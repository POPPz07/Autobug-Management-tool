<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AutoRepro - Login</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "secondary-fixed-dim": "#cdc0e9",

                            "surface-bright": "#3b383e",
                            "primary-fixed-dim": "#cfbcff",
                            "on-secondary": "#342b4b",
                            "on-background": "#e6e0e9",
                            "on-primary-fixed": "#22005d",
                            "on-tertiary-fixed": "#241a00",
                            "on-primary-fixed-variant": "#4f378a",
                            "secondary": "#cdc0e9",
                            "tertiary-container": "#c9a74d",
                            "secondary-container": "#4d4465",
                            "primary-container": "#6750a4",
                            "surface-container-lowest": "#0f0d13",
                            "primary-fixed": "#e9ddff",
                            "on-error-container": "#ffdad6",
                            "surface-container-highest": "#36343a",
                            "on-tertiary": "#3e2e00",
                            "inverse-primary": "#6750a4",

                            "surface": "#141218",
                            "on-primary": "#381e72",
                            "surface-container-low": "#1d1b20",
                            "on-tertiary-fixed-variant": "#594400",
                            "on-tertiary-container": "#503d00",
                            "primary": "#cfbcff",
                            "tertiary-fixed": "#ffdf93",
                            "on-surface-variant": "#cbc4d2",

                            "surface-tint": "#cfbcff",
                            "error-container": "#93000a",
                            "secondary-fixed": "#e9ddff",
                            "outline-variant": "#494551",
                            "on-secondary-fixed-variant": "#4b4263",

                            "on-primary-container": "#e0d2ff"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.125rem",
                            "lg": "0.25rem",
                            "xl": "0.5rem",
                            "full": "0.75rem"
                    },
                    "spacing": {
                            "md": "16px",
                            "lg": "24px",
                            "xs": "4px",
                            "xl": "48px",
                            "sm": "8px"
                    },
                    "fontFamily": {
                            "h1": ["Syne"],
                            "body-sm": ["DM Sans"],
                            "body-lg": ["DM Sans"],

                    }
                }
            }
        }
    </script>
<style>
        /* Custom Dot Grid Pattern */
        .dot-grid {
            background-image: radial-gradient(circle at center, #2A2E3A 1px, transparent 1px);
            background-size: 24px 24px;
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
        }

        /* Input focus glows based on Style Guidance */
        .input-glow:focus-within {
            border-color: #00E5FF;
            box-shadow: 0px 0px 8px rgba(0, 229, 255, 0.2);
        }

        /* Primary Button Style Guidance */
        .btn-primary {
            background-color: #00E5FF;
            color: #0A0B0D;
            transition: all 0.2s ease-in-out;
        }
        .btn-primary:hover {
            box-shadow: 0px 0px 12px rgba(0, 229, 255, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-on-surface flex font-body-md bg-background">
<!-- LEFT HALF: Brand Canvas -->
<div class="hidden md:flex flex-col w-1/2 h-full relative bg-[#0A0B0D] border-r border-[#1F222C] p-xl justify-between overflow-hidden">
<!-- Logo Header -->
<div class="flex items-center gap-sm relative z-10">
<div class="w-8 h-8 rounded bg-[#00E5FF] flex items-center justify-center text-[#0A0B0D]">
<span class="material-symbols-outlined font-bold text-[20px]" style="font-variation-settings: 'FILL' 1;">bug_report</span>
</div>
<span class="font-h2 text-h2 text-on-surface">AutoRepro</span>
</div>
<!-- Center Pattern -->
<div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none opacity-60">
<div class="w-[150%] h-[150%] dot-grid relative">
<!-- Random Cyan Glowing Dots for Data-Viz Aesthetic -->
<div class="absolute w-[5px] h-[5px] rounded-full bg-[#00E5FF] top-[30%] left-[40%] shadow-[0_0_8px_#00E5FF]"></div>
<div class="absolute w-[5px] h-[5px] rounded-full bg-[#00E5FF] top-[60%] left-[65%] shadow-[0_0_8px_#00E5FF]"></div>
<div class="absolute w-[5px] h-[5px] rounded-full bg-[#00E5FF] top-[45%] left-[55%] shadow-[0_0_8px_#00E5FF]"></div>
<div class="absolute w-[5px] h-[5px] rounded-full bg-[#00E5FF] top-[70%] left-[30%] shadow-[0_0_8px_#00E5FF]"></div>
<div class="absolute w-[5px] h-[5px] rounded-full bg-[#00E5FF] top-[20%] left-[70%] shadow-[0_0_8px_#00E5FF]"></div>
</div>
</div>
<!-- Bottom Tagline -->
<div class="relative z-10 max-w-md">
<h1 class="font-h1 text-[48px] leading-[1.1] tracking-[-0.03em] font-semibold text-on-surface">
                Reproduce bugs.<br/>
<span class="text-[#00E5FF]">Automatically.</span>
</h1>
</div>
</div>
<!-- RIGHT HALF: Auth Form -->
<div class="w-full md:w-1/2 h-full flex items-center justify-center bg-[#111318] p-lg sm:p-xl relative">
<!-- Mobile Logo (Hidden on Desktop) -->
<div class="absolute top-lg left-lg flex md:hidden items-center gap-sm">
<div class="w-6 h-6 rounded bg-[#00E5FF] flex items-center justify-center text-[#0A0B0D]">
<span class="material-symbols-outlined font-bold text-[16px]" style="font-variation-settings: 'FILL' 1;">bug_report</span>
</div>
<span class="font-h3 text-h3 text-on-surface">AutoRepro</span>
</div>
<div class="w-full max-w-[400px] flex flex-col gap-xl">
<!-- Header -->
<div class="flex flex-col gap-xs text-center md:text-left">
<h2 class="font-h1 text-h1 text-on-surface">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to AutoRepro</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-lg" method="POST" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="relative input-glow rounded border border-[#1F222C] bg-background flex items-center px-md py-sm transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant mr-sm text-[20px]">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 font-body-md text-on-surface placeholder:text-outline" id="email" placeholder="engineer@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center ml-xs mr-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-[#00E5FF] transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative input-glow rounded border border-[#1F222C] bg-background flex items-center px-md py-sm transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant mr-sm text-[20px]">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 font-code-md text-code-md tracking-wider text-on-surface placeholder:text-outline placeholder:font-body-md placeholder:tracking-normal" id="password" placeholder="••••••••" required="" type="password"/>
<button class="ml-sm text-on-surface-variant hover:text-on-surface focus:outline-none flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Action -->
<button class="btn-primary w-full py-[12px] rounded font-label-caps text-[12px] font-bold tracking-widest uppercase mt-sm" type="submit">
                    Sign in
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md">
<div class="flex-1 h-[1px] bg-[#1F222C]"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant">or</span>
<div class="flex-1 h-[1px] bg-[#1F222C]"></div>
</div>
<!-- Footer Note -->
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="text-on-surface underline hover:text-[#00E5FF] transition-colors" href="#">Contact your administrator.</a>
</p>
</div>
</div>
</div>
</body></html>
